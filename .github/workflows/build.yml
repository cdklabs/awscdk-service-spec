# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
  merge_group: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      self_mutation_happened: ${{ steps.self_mutation.outputs.self_mutation_happened }}
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          lfs: true
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install --no-immutable
      - name: build
        run: yarn projen build
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "self_mutation_happened=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./
      - name: Upload patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true
      - name: Fail build on mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat repo.patch
          exit 1
      - name: Upload head database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db.head.json.gz
          path: packages/@aws-cdk/aws-service-spec/db.json.gz
          overwrite: true
      - name: Upload released database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db.released.json.gz
          path: sources/ReleasedDatabase/db.json.gz
          overwrite: true
      - name: Verify released database
        run: |-
          if ! echo "3f9adee9f3594d07ebbde5c741b515d68feb3914741e603ddb3bc070867c7ee0  sources/ReleasedDatabase/db.json.gz" | sha256sum --check --strict; then
            echo "::error::sources/ReleasedDatabase/db.json.gz does not have the sha256 that .projenrc.ts pins in RELEASED_SERVICE_SPEC_SHA256. Update the version, the integrity and the sha256 together, see README.md."
            exit 1
          fi
      - name: Check L1 compatibility
        run: packages/@aws-cdk/service-spec-importers/bin/diff-db --l1-compat sources/ReleasedDatabase/db.json.gz packages/@aws-cdk/aws-service-spec/db.json.gz
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          repository: ${{ github.repository }}
          path: base-branch
      - name: Check L1 compatibility with the base branch released database
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |-
          if [ ! -f base-branch/sources/ReleasedDatabase/db.json.gz ]; then
            echo "The base branch has no released database to compare with."
          else
            git -C base-branch lfs pull --include=sources/ReleasedDatabase/db.json.gz
            if cmp -s base-branch/sources/ReleasedDatabase/db.json.gz sources/ReleasedDatabase/db.json.gz; then
              echo "The released database is the same as on the base branch."
            else
              echo "The released database changed from $(cat base-branch/sources/ReleasedDatabase/VERSION) (sha256 $(sha256sum < base-branch/sources/ReleasedDatabase/db.json.gz | cut -d ' ' -f 1)) on the base branch to $(cat sources/ReleasedDatabase/VERSION) (sha256 $(sha256sum < sources/ReleasedDatabase/db.json.gz | cut -d ' ' -f 1)) in this change. Compared with the released database of the base branch:"
              packages/@aws-cdk/service-spec-importers/bin/diff-db --l1-compat base-branch/sources/ReleasedDatabase/db.json.gz packages/@aws-cdk/aws-service-spec/db.json.gz
            fi
          fi
  self-mutation:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && needs.build.outputs.self_mutation_happened && !(github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          lfs: true
      - name: Download patch
        id: download_patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: repo.patch
          path: ${{ runner.temp }}
      - name: Apply patch
        id: apply_patch
        run: '[ -s ${{ runner.temp }}/repo.patch ] && git apply ${{ runner.temp }}/repo.patch || echo "Empty patch. Skipping."'
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Push changes
        id: push_changes
        env:
          PULL_REQUEST_REF: ${{ github.event.pull_request.head.ref }}
        run: |-
          git add .
          git commit -s -m "chore: self mutation"
          git push origin "HEAD:$PULL_REQUEST_REF"
  base-database:
    runs-on: awscdk-service-spec_ubuntu-latest_32-core
    permissions: {}
    env:
      CI: "true"
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          lfs: true
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Build base database
        id: build_base_database
        run: yarn exec nx run @aws-cdk/aws-service-spec:compile
      - name: Upload base database
        id: upload_base_database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db.base.json.gz
          path: packages/@aws-cdk/aws-service-spec/db.json.gz
          overwrite: true
      - name: Collect base released database
        id: collect_base_released_database
        run: |-
          mkdir -p base-released
          if [ -f sources/ReleasedDatabase/db.json.gz ]; then
            cp sources/ReleasedDatabase/db.json.gz sources/ReleasedDatabase/VERSION base-released/
          else
            echo none > base-released/VERSION
          fi
      - name: Upload base released database
        id: upload_base_released_database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db.base-released
          path: base-released
          overwrite: true
  diff-db:
    needs:
      - build
      - base-database
    runs-on: awscdk-service-spec_ubuntu-latest_32-core
    permissions:
      contents: write
      id-token: none
      pull-requests: write
    env:
      CI: "true"
    if: "!(needs.build.outputs.self_mutation_happened) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Build diff-db
        id: build_diff-db
        run: yarn exec nx run @aws-cdk/service-spec-importers:compile
      - name: Download base database
        id: download_base_database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: db.base.json.gz
          path: base
      - name: Download head database
        id: download_head_database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: db.head.json.gz
          path: head
      - name: Download released database
        id: download_released_database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: db.released.json.gz
          path: released
      - name: Download base released database
        id: download_base_released_database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: db.base-released
          path: base-released
      - name: Diff databases
        id: diff-db
        run: packages/@aws-cdk/service-spec-importers/bin/diff-db base/db.json.gz head/db.json.gz > DIFF || echo "diff-result=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Check L1 compatibility
        id: l1-compat
        run: |-
          packages/@aws-cdk/service-spec-importers/bin/diff-db --l1-compat released/db.json.gz head/db.json.gz > L1-COMPAT || echo "l1-compat-failed=true" >> $GITHUB_OUTPUT
          cat L1-COMPAT
      - name: Check L1 compatibility with the base branch released database
        id: l1-compat-base
        run: |-
          if [ ! -f base-released/db.json.gz ]; then
            echo "The base branch has no released database to compare with." > L1-COMPAT-BASE
          elif cmp -s base-released/db.json.gz released/db.json.gz; then
            touch L1-COMPAT-BASE
          else
            echo "The released database changed from $(cat base-released/VERSION) (sha256 $(sha256sum < base-released/db.json.gz | cut -d ' ' -f 1)) on the base branch to $(cat sources/ReleasedDatabase/VERSION) (sha256 $(sha256sum < released/db.json.gz | cut -d ' ' -f 1)) in this change. Compared with the released database of the base branch:" > L1-COMPAT-BASE
            packages/@aws-cdk/service-spec-importers/bin/diff-db --l1-compat base-released/db.json.gz head/db.json.gz >> L1-COMPAT-BASE || echo "l1-compat-failed=true" >> $GITHUB_OUTPUT
            echo "" >> L1-COMPAT-BASE
          fi
          cat L1-COMPAT-BASE
      - name: Upload diff
        id: upload_diff
        if: steps.diff-db.outputs.diff-result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db-diff-${{ github.event.pull_request.head.sha }}
          path: DIFF
          overwrite: true
      - name: Create PR.md
        id: create_pr_md
        if: steps.diff-db.outputs.diff-result
        env:
          DIFF_LIMIT: "200000"
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |-
          if [ $(wc -c < DIFF) -gt $DIFF_LIMIT ]; then
            echo "> [!WARNING]" >> PR.md
            echo "> Diff too large for inline display. Download the full diff using the link below." >> PR.md
            echo "" >> PR.md
          fi
          echo '**@aws-cdk/aws-service-spec**: Model database diff detected' >> PR.md
          echo '```' >> PR.md
          cat L1-COMPAT-BASE L1-COMPAT >> PR.md
          echo '```' >> PR.md
          echo "[📁 Download full diff](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})" >> PR.md
          echo '```' >> PR.md
          head -c $DIFF_LIMIT DIFF >> PR.md
          if [ $(wc -c < DIFF) -gt $DIFF_LIMIT ]; then
            echo "" >> PR.md
            echo "... (truncated)" >> PR.md
          fi
          echo '```' >> PR.md
      - name: Comment diff
        id: comment_diff
        if: steps.diff-db.outputs.diff-result
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: diff-db
          mode: recreate
          file-path: PR.md
      - name: Delete outdated diff
        id: delete_outdated_diff
        if: "!(steps.diff-db.outputs.diff-result)"
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: diff-db
          message: "**@aws-cdk/aws-service-spec**: No model change detected"
          mode: upsert
      - name: Fail on lost type history
        id: fail_on_lost_type_history
        if: "!cancelled() && (steps.l1-compat.outputs.l1-compat-failed || steps.l1-compat-base.outputs.l1-compat-failed)"
        run: |-
          echo "::error::The L1 compatibility check failed: the new database lost released type names or fields, or the check did not run."
          cat L1-COMPAT-BASE L1-COMPAT
          exit 1
