# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
  merge_group: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      self_mutation_happened: ${{ steps.self_mutation.outputs.self_mutation_happened }}
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          lfs: true
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install --no-immutable
      - name: build
        run: yarn projen build
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "self_mutation_happened=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./
      - name: Upload patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true
      - name: Fail build on mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat repo.patch
          exit 1
      - name: Upload head database
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: db.head.json.gz
          path: packages/@aws-cdk/aws-service-spec/db.json.gz
          overwrite: true
  base-database:
    runs-on: awscdk-service-spec_ubuntu-latest_32-core
    permissions: {}
    env:
      CI: "true"
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          lfs: true
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Build base database
        id: build_base_database
        run: yarn exec nx run @aws-cdk/aws-service-spec:compile
      - name: Upload base database
        id: upload_base_database
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: db.base.json.gz
          path: packages/@aws-cdk/aws-service-spec/db.json.gz
          overwrite: true
  diff-db:
    needs:
      - build
      - base-database
    runs-on: awscdk-service-spec_ubuntu-latest_32-core
    permissions:
      contents: write
      id-token: none
      pull-requests: write
    env:
      CI: "true"
    if: "!(needs.build.outputs.self_mutation_happened) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Build diff-db
        id: build_diff-db
        run: yarn exec nx run @aws-cdk/service-spec-importers:compile
      - name: Download base database
        id: download_base_database
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: db.base.json.gz
          path: base
      - name: Download head database
        id: download_head_database
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: db.head.json.gz
          path: head
      - name: Diff databases
        id: diff-db
        run: packages/@aws-cdk/service-spec-importers/bin/diff-db base/db.json.gz head/db.json.gz > DIFF || echo "diff-result=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Report L1 changes
        id: report_l1_changes
        run: |-
          if ! packages/@aws-cdk/service-spec-importers/bin/diff-db --l1-changes base/db.json.gz head/db.json.gz > L1-CHANGES; then
            echo "The L1 change report failed, see the job log." > L1-CHANGES
          fi
          cat L1-CHANGES
      - name: List breaking changes
        id: list_breaking_changes
        run: |-
          if ! packages/@aws-cdk/service-spec-importers/bin/diff-db --breaking-changes base/db.json.gz head/db.json.gz > BREAKING-CHANGES; then
            echo "The breaking change list failed, see the job log." > BREAKING-CHANGES
          fi
          cat BREAKING-CHANGES
      - name: Upload diff
        id: upload_diff
        if: steps.diff-db.outputs.diff-result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: db-diff-${{ github.event.pull_request.head.sha }}
          path: DIFF
          overwrite: true
      - name: Create PR.md
        id: create_pr_md
        if: steps.diff-db.outputs.diff-result
        env:
          DIFF_LIMIT: "200000"
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |-
          {
            echo '**@aws-cdk/aws-service-spec**: Model database diff detected'
            echo '```'
            cat L1-CHANGES
            echo '```'
            echo '**Breaking changes** (changelog text):'
            echo '```'
            cat BREAKING-CHANGES
            echo '```'
            echo "[📁 Download full diff](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})"
            echo '```'
          } > PR-PARTS
          WARNING=$'> [!WARNING]\n> Diff too large for inline display. Download the full diff using the link below.\n\n'
          MARKER=$'\n... (truncated)\n'
          FENCE=$'```\n'
          # Only the model diff is shortened, to what the limit leaves after the other parts
          BUDGET=$(( DIFF_LIMIT - $(wc -c < PR-PARTS) - ${#FENCE} ))
          if [ $(wc -c < DIFF) -le $BUDGET ]; then
            { cat PR-PARTS DIFF; printf %s "$FENCE"; } > PR.md
          else
            BUDGET=$(( BUDGET - ${#WARNING} - ${#MARKER} ))
            { printf %s "$WARNING"; cat PR-PARTS; head -c $(( BUDGET > 0 ? BUDGET : 0 )) DIFF; printf %s "$MARKER$FENCE"; } > PR.md
          fi
      - name: Comment diff
        id: comment_diff
        if: steps.diff-db.outputs.diff-result
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: diff-db
          mode: recreate
          file-path: PR.md
      - name: Delete outdated diff
        id: delete_outdated_diff
        if: "!(steps.diff-db.outputs.diff-result)"
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: diff-db
          message: "**@aws-cdk/aws-service-spec**: No model change detected"
          mode: upsert
